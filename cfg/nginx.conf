server {
    listen 80;
    server_name webrtc.5gen.care;
    return 301 https://\$host\$request_uri;
}

server {
    listen 443 ssl;
    server_name webrtc.5gen.care;

    ssl_certificate     /etc/letsencrypt/live/webrtc.5gen.care/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webrtc.5gen.care/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Serve ws.html at /ws (and / serves it too)
    root /var/www/webrtc;
    index ws.html;

    # Serve static files (ws.html)
    location = / {
        try_files /ws.html =404;
    }

    location = /ws {
        try_files /ws.html =404;
    }
    location / {
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://localhost:8080/;
	add_header Access-Control-Allow-Origin *;
    }

    location /downloads/ {
        alias /var/www/downloads/; # Make sure this folder exists on your server

        # Optional: shows a clean list of files if someone hits the raw /downloads/ folder
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # Forces the browser to download the files rather than opening them in-tab
        add_header Content-Disposition "attachment";

        # Performance tweaks for downloading large files
        sendfile on;
        tcp_nopush on;
    }
}
